# SCALA 8B-A1B v3 training run: single GPU (vast.ai RTX PRO 6000 Blackwell).
# bf16 optimiser masters need stochastic rounding or small updates are swallowed.
train:
  model_config: configs/base_8b_a1b_v3.yaml
  data_root: /workspace/tokens
  out_dir: /workspace/runs/scala-8b-a1b-v3
  run_name: scala-8b-a1b-v3

  # --- token budget ----------------------------------------------------------
  seq_len: 4096
  micro_batch_size: 4
  global_batch_tokens: 262144        # expert GEMMs see B*S rows per micro-batch
  # Sized so the WSD cooldown completes: a run cut off mid-decay loses most of
  # the decay's benefit.
  total_tokens: 360.0e6
  bs_warmup_start_frac: 0.5
  bs_warmup_tokens: 32.0e6

  # --- optimiser -------------------------------------------------------------
  # muP-style 1/width + sqrt-batch scaling from the d=512 base LR (1.5e-3).
  lr: 8.0e-4
  adamw_lr_mult: 1.0
  weight_decay: 0.1
  embedding_weight_decay: 0.0
  momentum: 0.95
  ns_steps: 5
  adam_betas: [0.9, 0.95]
  grad_clip: 1.0
  grad_clip_mode: zclip
  zclip_alpha: 0.97
  zclip_z: 2.5
  warmup_steps: 150
  decay_frac: 0.20
  min_lr_ratio: 0.0                  # decay to zero, not to a floor
  decay_shape: 1-sqrt
  spike_guard: true

  # --- objective schedules ---------------------------------------------------
  moe_bias_freeze_frac: 0.95
  mtp_weight_start: 0.3
  mtp_weight_end: 0.1
  self_cond_prob_end: 0.25
  self_cond_ramp_frac: 0.5

  # --- two-phase data curriculum ---------------------------------------------
  # One manifest holds all sources; without `pretrain_weights` the sampler
  # would draw the mid-training shards during pretraining too.
  pretrain_weights:
    mid_ja_magpie: 0.0
    mid_ja_multiturn: 0.0
    mid_ja_wiki_extract: 0.0
    mid_ja_jaster: 0.0
    mid_ja_edu: 0.0
    mid_ja_wiki: 0.0
    mid_ag_nemotron_tools: 0.0
    mid_ag_dsv4_tools: 0.0
    mid_ag_kimi_k3: 0.0
    mid_ag_laguna: 0.0
    mid_ja_funccall: 0.0
    mid_ja_qa_reasoning: 0.0
    mid_jp_en_coding: 0.0
    mid_math_swallow: 0.0

  midtrain_frac: 0.15
  # Mixture defined in data_ja_v3_mid.yaml.
  midtrain_weights:
    mid_ja_magpie: 0.13
    mid_ja_multiturn: 0.08
    mid_ja_wiki_extract: 0.07
    mid_ja_jaster: 0.07
    mid_ja_edu: 0.22
    mid_ja_wiki: 0.08
    mid_ja_funccall: 0.04
    mid_ja_qa_reasoning: 0.05
    mid_ag_nemotron_tools: 0.06
    mid_ag_dsv4_tools: 0.05
    mid_ag_kimi_k3: 0.04
    mid_ag_laguna: 0.03
    mid_jp_en_coding: 0.05
    mid_math_swallow: 0.03
    ja_fineweb2_edu: 0.0
    ja_fineweb2: 0.0
    ja_wikipedia: 0.0
    ja_aozora: 0.0
    en_nemotron_hq: 0.0
    en_fineweb_edu: 0.0
    code_swallow_v2: 0.0
    math_swallow_v2: 0.0

  # --- systems ---------------------------------------------------------------
  parallel: none
  dtype: bfloat16
  param_dtype: bfloat16
  optimizer_state_dtype: bfloat16
  compile: true
  compile_mode: default
  activation_checkpointing: selective
  ac_every_n: 2
  num_workers: 8
  seed: 20260728
  max_memory_fraction: 0.0           # dedicated GPU; no unified-memory hazard

  # --- io --------------------------------------------------------------------
  # resume: auto + frequent saves: rented instances can vanish.
  log_every: 20
  eval_every: 400
  eval_batches: 20
  save_every: 300
  keep_last: 2
  wandb_project: null
  resume: auto
