      pos: rope
      rope_theta: 500000.0
      rope_partial: 0.5
      window: null
      block: null
      attn_sink: false
      output_gate: true
      softmax_scale: null
      dropout: 0.0
    moe:
      enabled: false
      n_routed_experts: 64
      n_shared_experts: 1
      top_k: 6
      expert_inter_size: 768
      shared_inter_size: 768
      score_func: sigmoid
      norm_topk_prob: true
      routed_scaling_factor: 2.5
      bias_update_rate: 0.001
      bias_controller: sign
      pid_kp: 1.0
      pid_ki: 0.05
      pid_kd: 0.2
      bias_clip: 2.0
      seq_aux_loss_weight: 0.0001
      router_z_loss_weight: 0.001
      n_groups: 1
      topk_groups: 1
      capacity_factor: null
    norm_eps: 1.0e-06
    scale_residual_init: true
    learned_residual_scale: true
