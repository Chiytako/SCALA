# SCALA k=2 probe config with tie_mid_levels off (level 3 owns its own weights
# instead of sharing level 2's).
vocab_size: 99584
d_token: 384
max_seq_len: 4096
levels:
- chunk_size: 4
  converter_width: 1
  converter_kernel: 3
  chunker: concat
  encoder:
    d_model: 384
    n_layers: 4
    ffn_inter_size: 1024
    n_dense_layers: 4
