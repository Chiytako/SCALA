# Japanese-majority data mixture; weights are sampling probabilities, not corpus sizes.
tokenizer: llm-jp/llm-jp-3-1.8b
append_eos: true
shard_tokens: 67108864
dtype: uint32
seed: 20260726

sources:
  - name: ja_wikipedia
    hf: wikimedia/wikipedia
    config: 20231101.ja
    split: train
    text_key: text
    weight: 0.75
    epochs_cap: 4.0

  - name: en_wikipedia
    hf: wikimedia/wikipedia
    config: 20231101.en
    split: train
    text_key: text
    weight: 0.25
    epochs_cap: 4.0
