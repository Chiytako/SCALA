# SCALA 8B-A1B pretraining run: 8x H100/H200 SXM node (vast.ai).
train:
  model_config: configs/base_8b_a1b.yaml
  data_root: /data/tokens
  out_dir: /workspace/runs/scala-8b-a1b
  run_name: scala-8b-a1b

  # --- token budget ------------------------------------------------------
  seq_len: 8192
  micro_batch_size: 2
  global_batch_tokens: 2097152        # 2M tokens/step -> 57,220 steps
  total_tokens: 120.0e9
  bs_warmup_start_frac: 0.25
  bs_warmup_tokens: 8.0e9

  # --- optimiser -------------------------------------------------------------
  lr: 3.0e-4                          # Muon w/ RMS-matching: reuse AdamW LRs
  adamw_lr_mult: 1.0
  weight_decay: 0.1
  embedding_weight_decay: 0.0
  momentum: 0.95
  ns_steps: 5
  adam_betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 2000
  decay_frac: 0.2                     # last 20% is the WSD cooldown
  min_lr_ratio: 0.03
  decay_shape: 1-sqrt
  spike_guard: true

  # --- objective schedules ---------------------------------------------------
  moe_bias_freeze_frac: 0.95          # gamma -> 0 for the final 5%
  mtp_weight_start: 0.3
  mtp_weight_end: 0.1
  self_cond_prob_end: 0.25            # scheduled sampling for RecGen fidelity
  self_cond_ramp_frac: 0.5

  # --- systems ---------------------------------------------------------------
  parallel: fsdp
  dtype: bfloat16
  compile: true
  compile_mode: default
  activation_checkpointing: selective
  ac_every_n: 2
  num_workers: 8
  seed: 20260726

  # --- io --------------------------------------------------------------------
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  keep_last: 3
  wandb_project: scala
  resume: auto
